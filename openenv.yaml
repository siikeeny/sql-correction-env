---
title: SQL Correction RL Environment
emoji: 🛢️
colorFrom: blue
colorTo: indigo
sdk: docker
pinned: false
tags:
  - openenv
---

spec_version: 1
name: sql-correction-env
type: sequential
runtime: docker
app: server.app:app
port: 7860

description: >
  An OpenEnv RL environment where an AI agent fixes broken SQL queries.
  Simulates a real developer task: identifying and correcting SQL syntax
  and logical errors across easy, medium, and hard difficulty levels.

author: SyncShift

tasks:
  - id: easy
    difficulty: easy
    max_steps: 5
    description: Fix a single syntax error. Error hint provided.
    steps: 5
    ideal_action: correct_sql

  - id: medium
    difficulty: medium
    max_steps: 5
    description: Fix multiple errors across keywords and clauses. No hint.
    steps: 5
    ideal_action: correct_sql

  - id: hard
    difficulty: hard
    max_steps: 4
    description: Fix many errors in complex multi-join queries. Schema provided.
    steps: 4
    ideal_action: correct_sql

observation_space:
  type: object
  fields:
    task_id:
      type: string
    broken_query:
      type: string
    schema_context:
      type: string
      nullable: true
    error_hint:
      type: string
      nullable: true
    step_number:
      type: integer
    previous_attempt:
      type: string
      nullable: true
    feedback:
      type: string
      nullable: true

action_space:
  type: object
  fields:
    corrected_query:
      type: string

reward:
  range: [0.001, 0.999]
  description: >
    0.999 = exact match, 0.7 = right tokens minor structure diff,
    0.4 = most keywords correct, 0.2 = basic structure present, 0.001 = invalid SQL.

scoring:
  reward_range: [0.001, 0.999]
  success_threshold: 0.5
  score_formula: mean(step_rewards)

constraints:
  max_runtime_seconds: 1200
  max_memory_gb: 8
  max_vcpu: 2